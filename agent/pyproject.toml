[project]
name = "tsuzuri-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.42.0",
    "python-dotenv>=1.2.3",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
